[project]
name = "sumow"
version = "0.1.0"
description = "JAX/Equinox implementation of super weight analysis for LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.9",
    "equinox>=0.13.6",
    "jax>=0.9.2",
    "jaxtyping>=0.3.9",
    "omegaconf>=2.3.0",
    "optax>=0.2.8",
    "pydantic>=2.13.1",
    "safetensors>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
